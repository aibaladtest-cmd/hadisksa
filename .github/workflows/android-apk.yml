
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx --yes @capacitor/cli@8.6.2 add android

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Apply custom app icons
        run: |
          mkdir -p android/app/src/main/res
          cp -R native-icons/android/res/. android/app/src/main/res/

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/حدیث کساء.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadith-Kisa-Android
          path: release/حدیث کساء.apk
          if-no-files-found: error
          retention-days: 14
